server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: any unmatched path falls back to
    # index.html so deep links (e.g. /workspaces/abc/boards/xyz) work on
    # a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
